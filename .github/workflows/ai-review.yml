name: AI Code Review

on:
  workflow_run:
    workflows: ["Lint"]
    types: [completed]

permissions:
  contents: read

jobs:
  review:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ai-review-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
      cancel-in-progress: true
    steps:
      - name: Generate reviewer-bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.REVIEWER_BOT_CLIENT_ID }}
          private-key: ${{ secrets.REVIEWER_BOT_PRIVATE_KEY }}

      - name: Resolve PR context
        id: pr
        env:
          PR_JSON: ${{ toJSON(github.event.workflow_run.pull_requests) }}
        run: |
          pr_count=$(echo "$PR_JSON" | jq 'length')
          if [ "$pr_count" -eq 0 ]; then
            echo "::error::workflow_run had no associated pull_requests (fork PR, or PR closed before this ran?)"
            exit 1
          fi
          echo "number=$(echo "$PR_JSON" | jq -r '.[0].number')" >> "$GITHUB_OUTPUT"
          echo "head_ref=$(echo "$PR_JSON" | jq -r '.[0].head.ref')" >> "$GITHUB_OUTPUT"
          echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

      - name: Staleness guard
        id: staleness
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          current_sha=$(gh pr view "${{ steps.pr.outputs.number }}" --repo "${{ github.repository }}" --json headRefOid -q .headRefOid)
          if [ "$current_sha" != "${{ steps.pr.outputs.sha }}" ]; then
            echo "PR has moved on since this run's SHA (${{ steps.pr.outputs.sha }} -> $current_sha) - skipping, a newer run will cover it"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout PR head
        if: steps.staleness.outputs.stale == 'false'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git identity
        if: steps.staleness.outputs.stale == 'false'
        run: |
          git config user.name "jw-company-reviewer-bot[bot]"
          git config user.email "320745438+jw-company-reviewer-bot[bot]@users.noreply.github.com"
          git config core.pager cat

      - name: Check iteration cap
        if: steps.staleness.outputs.stale == 'false'
        id: cap
        run: |
          # Count only commits *this workflow's own fix step* made (tagged
          # with the [ai-review-fix] marker below), not total commits ahead
          # of main - a branch can pick up unrelated commits (merges from
          # main, multiple implementation commits) that aren't review cycles.
          fix_commit_count=$(git log origin/main..HEAD --oneline --fixed-strings --grep='[ai-review-fix]' | wc -l | tr -d ' ')
          if [ "$fix_commit_count" -ge 3 ]; then
            echo "capped=true" >> "$GITHUB_OUTPUT"
          else
            echo "capped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Claude Code review
        if: steps.staleness.outputs.stale == 'false' && steps.cap.outputs.capped == 'false'
        id: claude
        uses: anthropics/claude-code-action@v1.0.201
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token }}
          show_full_output: true
          display_report: true
          bot_id: "320745438"
          bot_name: "jw-company-reviewer-bot[bot]"
          allowed_bots: "jw-company-developer-bot[bot],jw-company-reviewer-bot[bot]"
          prompt: |
            You are reviewing a pull request in the jw_player Android app
            (Kotlin, Jetpack Compose, single :app module, package
            com.joshuawallis.jwplayer). Read CLAUDE.md first and follow its
            conventions. Diff this branch against origin/main to see what
            changed.

            This PR was already implemented upstream to match an approved
            story's literal acceptance criteria - including any specific
            string literals, copy, or wording the story asked for. Your job
            is code correctness and convention, not product or content
            judgment. Never rewrite a string literal, piece of copy, or
            other deliberate content choice for taste, tone, or "this could
            be worded better" reasons - that is not a bug and not a
            convention violation, even if you'd have chosen different
            wording yourself. If you genuinely think a piece of content is
            wrong (offensive, factually incorrect, breaks a real
            accessibility/legal requirement), that's a product decision, not
            something to silently fix - use BLOCKED and explain it, don't
            use FIXED to change it yourself.

            Run every `./gradlew` command as a normal synchronous, foreground
            Bash call - one call that blocks until the command finishes -
            never in the background, and never with a `sleep`/polling loop
            waiting on a background task notification. This CI environment
            does not deliver background-task completion notifications the
            way an interactive session does, so starting one and waiting for
            it will stall until the step times out. If the command takes a
            while, that's fine - the tool call simply returns when it's
            actually done.

            Your working directory is already the repo root for this entire
            session and stays that way. Every git command you run must start
            with exactly `git status`, `git diff`, `git log`, `git add`, or
            `git commit` as the literal first words - no `-C <path>`, no
            `-c <key>=<value>`, no `--no-pager`, no `cd` first, no piping
            another command into git. Any of those will be denied outright
            (they don't match this session's allowed command list) and will
            look like a permission error, not a real problem to work around -
            if you ever see "requires approval" on a git command, the fix is
            to reissue it as a plain `git <subcommand> ...` with nothing
            before the subcommand, not to find a workaround.

            You must end by writing a file named `.ai_review_verdict` at the
            repo root (it is git-ignored - never `git add` or commit it).
            Line 1 must be exactly one of: APPROVE, FIXED, BLOCKED. If FIXED
            or BLOCKED, line 2 is a short one-line reason.

            - APPROVE: the change is correct, builds, and follows CLAUDE.md
              conventions as-is. Make no code changes.
            - FIXED: you found real, fixable code problems (bugs, convention
              violations, missing error handling for reachable cases, etc.)
              - never a rewrite of string literals/copy/wording, see above.
              Fix them directly, then run `./gradlew assembleDebug` and
              `./gradlew testDebugUnitTest` yourself and confirm both pass.
              Commit your fix locally with a message that starts with the
              literal text `[ai-review-fix] ` followed by a description of
              what you changed and why (this exact marker is how the workflow
              counts review cycles - do not omit or alter it). Do NOT push -
              a later workflow step does that.
            - BLOCKED: you found a real problem but cannot safely fix it
              yourself (ambiguous requirement, missing context, would need a
              product decision, etc.). Make NO commit. Explain the problem on
              line 2.

            Do not touch .github/workflows/, secrets, or files outside app/
            and top-level Gradle config.
          claude_args: |
            --model sonnet
            --allowedTools "Read,Edit,Write,Bash(git add:*),Bash(git commit:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(./gradlew:*),Bash(find:*),Bash(grep:*)"

      - name: Read verdict
        if: steps.staleness.outputs.stale == 'false' && steps.cap.outputs.capped == 'false'
        id: verdict
        run: |
          if [ ! -f .ai_review_verdict ]; then
            echo "::error::Claude did not write .ai_review_verdict"
            echo "verdict=MISSING" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          {
            echo "verdict=$(sed -n '1p' .ai_review_verdict)"
            echo "reason=$(sed -n '2p' .ai_review_verdict)"
          } >> "$GITHUB_OUTPUT"
          rm -f .ai_review_verdict

      - name: Independently verify build and tests
        if: steps.verdict.outputs.verdict == 'APPROVE' || steps.verdict.outputs.verdict == 'FIXED'
        run: |
          ./gradlew assembleDebug
          ./gradlew testDebugUnitTest

      - name: Push fix commit
        if: steps.verdict.outputs.verdict == 'FIXED'
        run: git push origin "HEAD:${{ steps.pr.outputs.head_ref }}"

      - name: Approve and merge
        if: steps.verdict.outputs.verdict == 'APPROVE'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr review "${{ steps.pr.outputs.number }}" --repo "${{ github.repository }}" --approve --body "Approved by AI Code Review - no issues found."
          gh pr merge "${{ steps.pr.outputs.number }}" --repo "${{ github.repository }}" --merge --delete-branch

      - name: Upload APK artifact for Device Farm
        if: steps.verdict.outputs.verdict == 'APPROVE' && success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Notify Slack (approved and merged)
        if: steps.verdict.outputs.verdict == 'APPROVE' && success()
        run: |
          pr_url="${{ github.event.workflow_run.repository.html_url }}/pull/${{ steps.pr.outputs.number }}"
          curl -sf -X POST -H 'Content-type: application/json' \
            --data "{\"text\": \"[AI Code Review] :white_check_mark: Approved and merged — PR: ${pr_url}\"}" \
            "${{ secrets.SLACK_JW_PLAYER_CI_WEBHOOK_URL }}"

      - name: Notify Slack (fix pushed)
        if: steps.verdict.outputs.verdict == 'FIXED' && success()
        env:
          PR_URL: ${{ github.event.workflow_run.repository.html_url }}/pull/${{ steps.pr.outputs.number }}
          REASON: ${{ steps.verdict.outputs.reason }}
        run: |
          payload=$(jq -n --arg pr_url "$PR_URL" --arg reason "$REASON" \
            '{text: ("[AI Code Review] :arrows_counterclockwise: Requested changes, fix pushed — PR: " + $pr_url + "\nReason: " + $reason)}')
          curl -sf -X POST -H 'Content-type: application/json' \
            --data "$payload" \
            "${{ secrets.SLACK_JW_PLAYER_CI_WEBHOOK_URL }}"

      - name: Notify Slack (blocked)
        if: steps.verdict.outputs.verdict == 'BLOCKED'
        env:
          PR_URL: ${{ github.event.workflow_run.repository.html_url }}/pull/${{ steps.pr.outputs.number }}
          REASON: ${{ steps.verdict.outputs.reason }}
        run: |
          payload=$(jq -n --arg pr_url "$PR_URL" --arg reason "$REASON" \
            '{text: ("[AI Code Review] :x: Blocked, needs a human — PR: " + $pr_url + "\nReason: " + $reason)}')
          curl -sf -X POST -H 'Content-type: application/json' \
            --data "$payload" \
            "${{ secrets.SLACK_JW_PLAYER_CI_WEBHOOK_URL }}"

      - name: Notify Slack (iteration cap)
        if: steps.cap.outputs.capped == 'true'
        run: |
          pr_url="${{ github.event.workflow_run.repository.html_url }}/pull/${{ steps.pr.outputs.number }}"
          curl -sf -X POST -H 'Content-type: application/json' \
            --data "{\"text\": \"[AI Code Review] :warning: Fix/review loop hit its cap (3 fix commits) — PR: ${pr_url}\nNeeds a human to look.\"}" \
            "${{ secrets.SLACK_JW_PLAYER_CI_WEBHOOK_URL }}"

      - name: Notify Slack (failure)
        if: failure()
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          pr_url="${{ github.event.workflow_run.repository.html_url }}/pull/${{ steps.pr.outputs.number }}"
          curl -sf -X POST -H 'Content-type: application/json' \
            --data "{\"text\": \"[AI Code Review] :x: Failed — PR: ${pr_url}\nRun: ${run_url}\"}" \
            "${{ secrets.SLACK_JW_PLAYER_CI_WEBHOOK_URL }}"
