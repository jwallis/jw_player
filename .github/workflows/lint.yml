name: Lint

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ktlint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate developer-bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.DEVELOPER_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DEVELOPER_BOT_PRIVATE_KEY }}

      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Run ktlint autofix
        id: ktlint
        run: |
          set +e
          ./gradlew ktlintFormat
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit autofix if needed
        id: commit
        run: |
          git config user.name "jw-company-developer-bot[bot]"
          git config user.email "320747005+jw-company-developer-bot[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "ktlint autofix"
            git push origin "HEAD:${{ github.head_ref }}"
            echo "autofixed=true" >> "$GITHUB_OUTPUT"
          else
            echo "autofixed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail if unfixable violations remain
        if: steps.ktlint.outputs.exit_code != '0'
        run: |
          echo "::error::ktlint found violations it could not auto-fix — see the ktlint autofix step's log above"
          exit 1

      - name: Notify Slack (success)
        if: success()
        run: |
          pr_url="${{ github.event.pull_request.html_url }}"
          if [ "${{ steps.commit.outputs.autofixed }}" = "true" ]; then
            status="autofixed"
          else
            status="clean"
          fi
          curl -sf -X POST -H 'Content-type: application/json' \
            --data "{\"text\": \"[Linter] :white_check_mark: ${status} — PR: ${pr_url}\nBranch: ${{ github.head_ref }}\"}" \
            "${{ secrets.SLACK_JW_PLAYER_CI_WEBHOOK_URL }}"

      - name: Notify Slack (failure)
        if: failure()
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          pr_url="${{ github.event.pull_request.html_url }}"
          curl -sf -X POST -H 'Content-type: application/json' \
            --data "{\"text\": \"[Linter] :x: Failed — PR: ${pr_url}\nBranch: ${{ github.head_ref }}\nRun: ${run_url}\"}" \
            "${{ secrets.SLACK_JW_PLAYER_CI_WEBHOOK_URL }}"
